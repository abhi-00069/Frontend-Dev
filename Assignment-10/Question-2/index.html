<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Portfolio</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style2.css">
</head>
<body>

<header class="bg-light text-dark text-center p-5">
  <h1 class="fw-bold">John Doe</h1>
  <p class="lead">Web Developer & Designer</p>
</header>

<main class="container text-center mt-4">
  <!-- Responsive image -->
  <img src="https://picsum.photos/250" class="img-fluid rounded-circle mb-3">

  <!-- Buttons -->
  <div class="mb-4">
    <button class="btn btn-primary me-2">Hire Me</button>
    <button class="btn btn-outline-secondary">Download CV</button>
  </div>

  <!-- Simple form -->
  <form class="mx-auto" style="max-width: 400px;">
    <input class="form-control mb-3" placeholder="Your Email">
    <textarea class="form-control mb-3" placeholder="Message"></textarea>
    <button class="btn btn-success w-100">Send</button>
  </form>
</main>

</body>
</html>
