<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalog</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style3.css">
</head>
<body>

<main class="container py-5">

  <div class="row g-4">
    <!-- 4-column grid on md, 2 on sm, 1 on xs -->
    <div class="col-12 col-sm-6 col-md-3">
      <div class="card shadow-sm product-card">
        <img src="https://picsum.photos/300" class="card-img-top">
        <div class="card-body text-center">
          <h5>Product A</h5>
          <p class="text-muted">$19.99</p>
          <button class="btn btn-primary w-100">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card shadow-sm product-card">
        <img src="https://picsum.photos/301" class="card-img-top">
        <div class="card-body text-center">
          <h5>Product B</h5>
          <p class="text-muted">$24.99</p>
          <button class="btn btn-primary w-100">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card shadow-sm product-card">
        <img src="https://picsum.photos/302" class="card-img-top">
        <div class="card-body text-center">
          <h5>Product C</h5>
          <p class="text-muted">$29.99</p>
          <button class="btn btn-primary w-100">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card shadow-sm product-card">
        <img src="https://picsum.photos/303" class="card-img-top">
        <div class="card-body text-center">
          <h5>Product D</h5>
          <p class="text-muted">$15.99</p>
          <button class="btn btn-primary w-100">Add to Cart</button>
        </div>
      </div>
    </div>

  </div>
</main>

</body>
</html>
