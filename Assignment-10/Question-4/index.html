<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Menu</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style4.css">
</head>
<body>

<main class="container py-5">

  <h1 class="text-center mb-4">Today's Menu</h1>

  <!-- Menu Table -->
  <table class="table table-striped text-center">
    <thead class="table-dark">
      <tr><th>Item</th><th>Category</th><th>Price</th></tr>
    </thead>
    <tbody>
      <tr><td>Pasta</td><td>Main</td><td>$12</td></tr>
      <tr><td>Soup</td><td>Starter</td><td>$6</td></tr>
      <tr><td>Tiramisu</td><td>Dessert</td><td>$8</td></tr>
    </tbody>
  </table>

  <!-- Specials -->
  <h3 class="mt-5 mb-2">Chef's Specials</h3>
  <ul class="list-group mb-4">
    <li class="list-group-item">Grilled Salmon</li>
    <li class="list-group-item">Herb Chicken</li>
  </ul>

  <!-- Image -->
  <figure class="text-center">
    <img src="https://picsum.photos/600/300" class="img-fluid rounded">
    <figcaption class="lead mt-2">Fresh Ingredients, Daily</figcaption>
  </figure>

</main>

</body>
</html>
