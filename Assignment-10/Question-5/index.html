<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Homepage</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    /* Theme overrides */
    :root {
      --bs-primary: #6a4cff;
      --bs-font-sans-serif: "Poppins", sans-serif;
    }
  </style>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style5.css">
</head>

<body>

<header class="bg-primary text-white text-center py-4">
  <h1 class="fw-bold">My Tech Blog</h1>
</header>

<main class="container py-5">

  <div class="row g-4">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <img src="https://picsum.photos/600" class="card-img-top">
        <div class="card-body">
          <h3 class="text-primary">Latest Trends in AI</h3>
          <p>Exploring new advancements and future predictions in artificial intelligence.</p>
          <button class="btn btn-primary">Read More</button>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm">
        <img src="https://picsum.photos/601" class="card-img-top">
        <div class="card-body">
          <h3 class="text-primary">Web Development Tips</h3>
          <p>Improve your workflow with these essential tips for modern developers.</p>
          <button class="btn btn-primary">Read More</button>
        </div>
      </div>
    </div>
  </div>

</main>

<footer class="text-center py-3 bg-light">
  © 2025 My Tech Blog
</footer>

</body>
</html>
