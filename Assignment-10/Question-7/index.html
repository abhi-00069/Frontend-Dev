<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style7.css">
</head>
<body>

<main class="container py-5">

  <h2 class="mb-3">Tasks <span class="badge bg-primary">5</span></h2>

  <ul class="list-group mb-4">
    <li class="list-group-item d-flex justify-content-between">
      Finish report <span class="badge bg-danger">High</span>
    </li>
    <li class="list-group-item d-flex justify-content-between">
      Update website <span class="badge bg-warning text-dark">Medium</span>
    </li>
    <li class="list-group-item d-flex justify-content-between">
      Email client <span class="badge bg-success">Low</span>
    </li>
  </ul>

  <button class="btn btn-success">
    Completed <span class="badge bg-dark">2</span>
  </button>

</main>

</body>
</html>
