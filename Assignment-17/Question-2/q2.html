<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Q2 Character Counter</title>
  <link rel="stylesheet" href="q2.css">
</head>
<body>
  <div class="container">
    <h2>Message</h2>
    <textarea id="messageBox" rows="6" maxlength="100"></textarea>
    <div class="controls">
      <span id="charCounter">100</span> characters left
      <button id="resetButton">Reset</button>
    </div>
  </div>
  <script src="q2.js"></script>
</body>
</html>
