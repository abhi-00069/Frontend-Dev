<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Q8 Custom Dropdown</title>
  <link rel="stylesheet" href="q8.css">
</head>
<body>
  <div class="dropdown" id="customDropdown">
    <button id="dropdownButton">Select option</button>
    <div id="optionsPanel" class="options hidden">
      <div class="option" data-value="Option 1">Option 1</div>
      <div class="option" data-value="Option 2">Option 2</div>
      <div class="option" data-value="Option 3">Option 3</div>
    </div>
  </div>
  <script src="q8.js"></script>
</body>
</html>
