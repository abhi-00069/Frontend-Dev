<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q10 - Registration Validation</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="q10.js" defer></script>
  <style>
    body { font-family: Arial; padding:20px; }
    form { max-width:480px; }
    .field { margin-bottom:10px; }
    input { width:100%; padding:8px; box-sizing:border-box; }
    .error { color:#b00; font-size:0.9rem; height:16px; }
    .success { color:green; font-weight:700; margin-top:8px; }
    .invalid { border:2px solid #b00; }
  </style>
</head>
<body>
  <main>
    <h1>Register</h1>
    <form id="regForm" novalidate>
      <div class="field">
        <label>Name<input id="name" required></label>
        <div id="nameErr" class="error"></div>
      </div>
      <div class="field">
        <label>Email<input id="email" required></label>
        <div id="emailErr" class="error"></div>
      </div>
      <div class="field">
        <label>Password<input id="password" type="password" required></label>
        <div id="passErr" class="error"></div>
      </div>
      <button type="submit">Submit</button>
    </form>

    <div id="success" class="success" style="display:none;">Form Submitted Successfully</div>
  </main>
</body>
</html>
