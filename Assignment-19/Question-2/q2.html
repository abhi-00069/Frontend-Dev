<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q2 - Product Highlight</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="q2.js" defer></script>
  <style>
    body { font-family: Arial; padding:20px; }
    .products { display:flex; gap:10px; flex-wrap:wrap; }
    .product { width:180px; padding:8px; border:1px solid #ddd; border-radius:6px; position:relative; }
    .product.discount { box-shadow: 0 0 0 3px rgba(255,200,100,0.2); }
    .product .details { display:none; font-size:0.9rem; margin-top:6px; }
    .favorite.selected { color:crimson; font-weight:bold; }
    .out { color:#b00; font-weight:700; }
  </style>
</head>
<body>
  <header><h1>Products</h1></header>
  <main>
    <section class="products" aria-label="product list">
      <article class="product" data-id="p1" data-price="200" data-discount="10">
        <h3 class="title">Pizza</h3>
        <div class="price">$200</div>
        <div class="stock" data-stock="5">In stock</div>
        <button class="favorite">♡ Favorite</button>
        <div class="details">Thin crust, extra cheese.</div>
      </article>

      <article class="product" data-id="p2" data-price="120" data-discount="0" data-stock="0">
        <h3 class="title">Burger</h3>
        <div class="price">$120</div>
        <div class="stock">Out of stock</div>
        <button class="favorite">♡ Favorite</button>
        <div class="details">Beef patty, lettuce.</div>
      </article>

      <article class="product" data-id="p3" data-price="80" data-discount="15" data-stock="3">
        <h3 class="title">Fries</h3>
        <div class="price">$80</div>
        <div class="stock">In stock</div>
        <button class="favorite">♡ Favorite</button>
        <div class="details">Crispy salted fries.</div>
      </article>

      <article class="product" data-id="p4" data-price="40" data-discount="0" data-stock="10">
        <h3 class="title">Coke</h3>
        <div class="price">$40</div>
        <div class="stock">In stock</div>
        <button class="favorite">♡ Favorite</button>
        <div class="details">Chilled soft drink.</div>
      </article>

      <article class="product" data-id="p5" data-price="300" data-discount="20" data-stock="2">
        <h3 class="title">Sushi</h3>
        <div class="price">$300</div>
        <div class="stock">In stock</div>
        <button class="favorite">♡ Favorite</button>
        <div class="details">Fresh salmon rolls.</div>
      </article>
    </section>
  </main>
</body>
</html>
