<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q8 - Blog Admin</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="q8.js" defer></script>
  <style>
    body { font-family: Arial; padding:20px; }
    .post { padding:8px; border:1px solid #eee; margin-bottom:8px; }
    .featured { border-color:#f39c12; background:#fffaf0; }
    .tag { font-size:0.85rem; color:#555; margin-right:6px; }
  </style>
</head>
<body>
  <main>
    <h1>Blog Posts</h1>

    <div>
      <button id="addPost">Add New Post</button>
      <button id="prependFeatured">Prepend Featured Post</button>
      <button id="removeLast">Remove Last Post</button>
      <button id="addTags">Add Tags</button>
      <input id="keyword" placeholder="Highlight keyword">
      <button id="highlight">Highlight</button>
    </div>

    <section id="posts">
      <article class="post">Post 1 - Launch day</article>
      <article class="post">Post 2 - Behind the scenes</article>
      <article class="post">Post 3 - New features</article>
      <article class="post">Post 4 - Team interview</article>
      <article class="post">Post 5 - Roadmap</article>
    </section>
  </main>
</body>
</html>
