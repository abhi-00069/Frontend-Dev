<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URI Encoding Example</title>
</head>
<body>
  <h2>URI Encoding Demonstration</h2>
  <p>
    Original URL with special characters:<br>
    <code>https://example.com/search?query=HTML & CSS</code>
  </p>
  <p>
    Encoded URL:<br>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">
      https://example.com/search?query=HTML%20%26%20CSS
    </a>
  </p>
</body>
</html>
