<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form with Embedded Result</title>
</head>
<body>
  <h2>Submit Your Name</h2>
  <form target="resultFrame" action="data:text/html;charset=UTF-8,
    <!DOCTYPE html>
    <html>
    <head><meta charset='UTF-8'><title>Result</title></head>
    <body><p>Form successfully submitted.</p></body>
    </html>" method="post">
    <label for="username">Name:</label><br>
    <input type="text" id="username" name="username" required><br><br>
    <input type="submit" value="Submit">
  </form>

  <h3>Result:</h3>
  <iframe name="resultFrame" width="100%" height="100" title="Result Frame"></iframe>
</body>
</html>
