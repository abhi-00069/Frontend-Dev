<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Form Example</title>
</head>
<body>
  <h2>Secure Login Form</h2>
  <form method="post" action="#" autocomplete="off">
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" required><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <input type="submit" value="Login">
  </form>

  <p>
    🔒 Turning off <code>autocomplete</code> helps improve security by preventing browsers from storing and auto-filling sensitive information like usernames and passwords, especially on shared or public devices.
  </p>
</body>
</html>
