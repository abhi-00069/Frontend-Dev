<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two Iframes Layout</title>
  <style>
    iframe {
      width: 100%;
      border: 0;
      display: block;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h2>My Introduction</h2>
  <iframe 
    src="introduction.html" 
    title="Introduction Page" 
    height="45%">
  </iframe>

  <h2>My Favorite Hobby</h2>
  <iframe 
    src="hobby.html" 
    title="Hobby Page" 
    height="45%">
  </iframe>
</body>
</html>
