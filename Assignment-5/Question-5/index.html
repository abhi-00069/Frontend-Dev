<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pricing Plans</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Choose Your Plan</h1>
  <div class="pricing-table">
    <div class="plan">
      <h2>Basic</h2>
      <ul>
        <li>1 Project</li>
        <li>Email Support</li>
        <li>Community Access</li>
      </ul>
      <div class="price">$9/month</div>
      <a href="#" class="btn">Select</a>
    </div>

    <div class="plan">
      <h2>Standard</h2>
      <ul>
        <li>5 Projects</li>
        <li>Priority Email Support</li>
        <li>Community Access</li>
      </ul>
      <div class="price">$29/month</div>
      <a href="#" class="btn">Select</a>
    </div>

    <div class="plan">
      <h2>Premium</h2>
      <ul>
        <li>Unlimited Projects</li>
        <li>24/7 Support</li>
        <li>Private Community</li>
      </ul>
      <div class="price">$59/month</div>
      <a href="#" class="btn">Select</a>
    </div>
  </div>
</body>
</html>
