<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Photo Gallery</h1>

  <div class="gallery">
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1015/400/300" alt="Mountain">
      <div class="caption">Majestic Mountains</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1025/400/300" alt="Dog">
      <div class="caption">Golden Retriever</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1043/400/300" alt="Ocean">
      <div class="caption">Ocean Waves</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1062/400/300" alt="Forest">
      <div class="caption">Misty Forest</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1074/400/300" alt="Desert">
      <div class="caption">Desert Dunes</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1084/400/300" alt="City">
      <div class="caption">City Skyline</div>
    </div>
  </div>

</body>
</html>
