<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="gallery">
    <figure>
      <img src="https://via.placeholder.com/400x300" alt="Mountain View">
      <figcaption>Mountain View</figcaption>
    </figure>

    <figure>
      <img src="https://via.placeholder.com/400x300" alt="Forest Trail">
      <figcaption>Forest Trail</figcaption>
    </figure>

    <figure>
      <img src="https://via.placeholder.com/400x300" alt="Ocean Waves">
      <figcaption>Ocean Waves</figcaption>
    </figure>

    <figure>
      <img src="https://via.placeholder.com/400x300" alt="Desert Dunes">
      <figcaption>Desert Dunes</figcaption>
    </figure>

    <figure>
      <img src="https://via.placeholder.com/400x300" alt="City Lights">
      <figcaption>City Lights</figcaption>
    </figure>

    <figure>
      <img src="https://via.placeholder.com/400x300" alt="Snow Peaks">
      <figcaption>Snow Peaks</figcaption>
    </figure>
  </section>
</body>
</html>
