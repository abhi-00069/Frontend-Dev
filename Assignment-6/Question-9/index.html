<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-inner">
        <div class="card-front">
          <img src="https://via.placeholder.com/300x200" alt="Card Image">
          <h2>Beautiful View</h2>
        </div>
        <div class="card-back">
          <p>This is a stunning view of nature captured at sunset, perfect for your next wallpaper.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
