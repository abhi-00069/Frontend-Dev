<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Borders & Padding Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Borders and Padding Demonstration</h1>
  <div class="container">
    <div class="box solid">Solid</div>
    <div class="box dashed">Dashed</div>
    <div class="box double">Double</div>
    <div class="box groove">Groove</div>
  </div>
  <div class="container">
    <div class="box solid rounded-sm">Rounded SM</div>
    <div class="box solid rounded-md">Rounded MD</div>
    <div class="box solid rounded-lg">Rounded LG</div>
  </div>
  <div class="container">
    <div class="box solid pad-sm">Pad SM</div>
    <div class="box solid pad-md">Pad MD</div>
    <div class="box solid pad-lg">Pad LG</div>
  </div>
</body>
</html>
