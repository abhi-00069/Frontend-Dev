<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tooltip Demonstration Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>CSS Tooltip Demonstration</h1>
  <div class="container">
    <div class="tooltip">
      💡
      <span class="tooltip-text">This is a light bulb tooltip!</span>
    </div>

    <div class="tooltip">
      ❤️
      <span class="tooltip-text">You hovered over a heart!</span>
    </div>

    <div class="tooltip">
      🌍
      <span class="tooltip-text">Hello from planet Earth!</span>
    </div>

    <div class="tooltip word">
      Hover me
      <span class="tooltip-text">This is a text-based tooltip.</span>
    </div>
  </div>
</body>
</html>
