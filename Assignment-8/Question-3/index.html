<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Image Showcase Gallery</h1>
  <div class="gallery">
    <figure class="image-card">
      <img src="https://picsum.photos/300/200?random=1" alt="Image 1">
      <figcaption>Beautiful Landscape</figcaption>
    </figure>
    <figure class="image-card">
      <img src="https://picsum.photos/300/200?random=2" alt="Image 2">
      <figcaption>City Lights at Night</figcaption>
    </figure>
    <figure class="image-card">
      <img src="https://picsum.photos/300/200?random=3" alt="Image 3">
      <figcaption>Mountain Adventure</figcaption>
    </figure>
    <figure class="image-card">
      <img src="https://picsum.photos/300/200?random=4" alt="Image 4">
      <figcaption>Serene Beach</figcaption>
    </figure>
    <figure class="image-card">
      <img src="https://picsum.photos/300/200?random=5" alt="Image 5">
      <figcaption>Autumn Woods</figcaption>
    </figure>
    <figure class="image-card">
      <img src="https://picsum.photos/300/200?random=6" alt="Image 6">
      <figcaption>Desert Sunset</figcaption>
    </figure>
  </div>
</body>
</html>
