<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Responsive Image Filter Gallery</h1>

  <section class="gallery">
    <figure>
      <img class="media blur" src="https://picsum.photos/id/1015/1200/900" alt="Mountain landscape" />
      <figcaption>Blur</figcaption>
    </figure>

    <figure>
      <img class="media grayscale" src="https://picsum.photos/id/1025/1200/900" alt="Dog portrait" />
      <figcaption>Grayscale</figcaption>
    </figure>

    <figure>
      <img class="media sepia" src="https://picsum.photos/id/1035/1200/900" alt="Forest path" />
      <figcaption>Sepia</figcaption>
    </figure>

    <figure>
      <img class="media brightness" src="https://picsum.photos/id/1043/1200/900" alt="City skyline" />
      <figcaption>Brightness</figcaption>
    </figure>

    <figure>
      <img class="media contrast" src="https://picsum.photos/id/1050/1200/900" alt="Beach at sunset" />
      <figcaption>Contrast</figcaption>
    </figure>

    <figure>
      <img class="media hue" src="https://picsum.photos/id/1069/1200/900" alt="Desert dunes" />
      <figcaption>Hue Rotate</figcaption>
    </figure>
  </section>
</body>
</html>
