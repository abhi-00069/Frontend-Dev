<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Cards with Animation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <section class="card-container">

    <div class="card">
      <img src="https://picsum.photos/id/1005/300/300" alt="Profile 1">
      <h2>John Doe</h2>
      <p>Web Developer</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1011/300/300" alt="Profile 2">
      <h2>Emily Smith</h2>
      <p>Graphic Designer</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1027/300/300" alt="Profile 3">
      <h2>Michael Lee</h2>
      <p>Content Creator</p>
    </div>

  </section>

</body>
</html>
