
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive CSS Cheat Sheet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Responsive CSS Cheat Sheet</h1>

<section class="grid">
  <div class="item">
    <h2>Filters</h2>
    <p>filter: grayscale(100%); filter: blur(3px);</p>
  </div>

  <div class="item">
    <h2>Media Queries</h2>
    <p>@media (max-width: 700px) { ... }</p>
  </div>

  <div class="item">
    <h2>Responsive Design</h2>
    <p>Use flex, grid, and fluid units like %, vw, rem.</p>
  </div>

  <div class="item">
    <h2>Typography</h2>
    <p>font-size: clamp(1rem, 3vw, 2rem);</p>
  </div>
</section>

</body>
</html>
