<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Design Principles</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1 class="title">Responsive Design Principles</h1>

<section class="grid">
  <div class="box">
    <h2>Fluid Layouts</h2>
    <p>Layouts scale using percentages and flexible units.</p>
    <pre>width: 80%;</pre>
  </div>

  <div class="box">
    <h2>Flexible Media</h2>
    <p>Images and videos resize smoothly within containers.</p>
    <pre>img { max-width: 100%; }</pre>
  </div>

  <div class="box">
    <h2>Breakpoints</h2>
    <p>Styles adjust at specific screen widths.</p>
    <pre>@media (max-width:600px)</pre>
  </div>
</section>

</body>
</html>
